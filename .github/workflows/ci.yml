name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: 🐘 Create databases and tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE tasks_test;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d tasks_db -f src/db/migrations.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d tasks_test -f src/db/migrations.sql
        working-directory: backend

      - name: 🔍 Run linter
        run: npm run lint
        working-directory: backend

      - name: 🧪 Run tests
        run: npm test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: tasks_test
          JWT_SECRET: test_secret_key
